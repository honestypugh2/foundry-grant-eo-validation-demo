[project]
name = "foundry-grant-eo-validation-demo"
version = "0.1.0"
description = "Grant proposal compliance automation using Azure AI Foundry"
authors = [
    {name = "Your Organization", email = "your-email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "python-dotenv>=1.2.2",
    "azure-ai-projects>=2.0.1",
    "azure-identity>=1.25.3",
    "azure-ai-inference>=1.0.0b9",
    "azure-search-documents>=11.6.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core>=1.39.0",
    "azure-storage-blob>=12.28.0",
    "openai>=2.31.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "PyPDF2>=3.0.1",
    "python-docx>=1.2.0",
    "requests>=2.33.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "plotly>=6.7.0",
    "fastapi>=0.135.3",
    "agent-framework[viz]>=1.0.1",
    "agent-framework-azurefunctions>=1.0.0b260409",
    "agent-framework-openai>=1.0.1",
    "azure-functions>=1.21.0",
    "azure-functions-durable>=1.5.0",
    "msgraph-sdk>=1.55.0",
    "nest-asyncio>=1.6.0",
    "azure-storage-queue>=12.15.0",
    "reportlab>=4.4.10",
    "diagrams>=0.25.1",
    "agent-framework-azure-ai-search>=0.0.0a1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["src"]
